{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | ChocoFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login2.css' %}">
</head>
<body class="login-page">

<div class="login-wrapper">

    <!-- ══ PANEL IZQUIERDO ══════════════════════════════════ -->
    <div class="login-left">
        <div class="deco-icon">🍫</div>
        <h1>¡Hola,<br>Bienvenido!</h1>
        <p>Inicia Sesión<br>Para Entrar a ChocoFlow</p>
    </div>

    <!-- ══ PANEL DERECHO ════════════════════════════════════ -->
    <div class="login-right">

        <h2 class="form-title">Iniciar Sesión</h2>
        <p class="form-subtitle">Ingresa tus credenciales para continuar</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-choco">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="input-group-custom">
                <input
                    type="email"
                    name="username"
                    class="form-control-login"
                    placeholder="Usuario"
                    required
                    autocomplete="email"
                >
                <span class="input-icon">👤</span>
            </div>

            <!-- Contraseña -->
            <div class="input-group-custom">
                <input
                    type="password"
                    name="password"
                    id="password-login"
                    class="form-control-login"
                    placeholder="Password"
                    required
                    autocomplete="current-password"
                >
                <span class="input-icon toggle-password" onclick="togglePassword('password-login', this)" title="Mostrar/ocultar contraseña">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c49a6c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path class="eye-top" d="M2 12 C6 6, 18 6, 22 12"/>
                        <path class="eye-bot" d="M2 12 C6 18, 18 18, 22 12"/>
                        <circle class="eye-pupil" cx="12" cy="12" r="2.8" fill="#c49a6c" stroke="none"/>
                    </svg>
                </span>
            </div>

            <button type="submit" class="btn-login-main">
                Iniciar Sesión
            </button>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword(inputId, iconEl) {
    const input    = document.getElementById(inputId);
    const eyeTop   = iconEl.querySelector('.eye-top');
    const eyeBot   = iconEl.querySelector('.eye-bot');
    const eyePupil = iconEl.querySelector('.eye-pupil');

    const OPEN  = { top: "M2 12 C6 6, 18 6, 22 12",  bot: "M2 12 C6 18, 18 18, 22 12" };
    const CLOSE = { top: "M2 12 C6 11, 18 11, 22 12", bot: "M2 12 C6 13, 18 13, 22 12" };

    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';

    eyeTop.setAttribute('d',   isPassword ? OPEN.top  : CLOSE.top);
    eyeBot.setAttribute('d',   isPassword ? OPEN.bot  : CLOSE.bot);
    eyePupil.style.opacity   = isPassword ? '1' : '0';
    eyePupil.style.transform = isPassword ? 'scale(1)' : 'scale(0)';
}
</script>
</body>
</html>
