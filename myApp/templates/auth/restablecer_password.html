{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Restablecer contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/restablecer_password.css' %}">
</head>
<body>

<h2>Nueva contraseña</h2>

<form method="POST">

    {% csrf_token %}

    <input
        type="password"
        name="password1"
        placeholder="Nueva contraseña"
        required
    >

    <br><br>

    <input
        type="password"
        name="password2"
        placeholder="Confirmar contraseña"
        required
    >

    <br><br>

    <button type="submit">
        Cambiar contraseña
    </button>

</form>

</body>
</html>
