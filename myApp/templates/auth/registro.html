{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | ChocoFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/login2.css' %}">
    <style>
        .login-wrapper { height: auto; min-height: 540px; }
        .login-left    { min-height: 580px; }
        .login-right   { padding: 36px 52px; justify-content: flex-start; overflow-y: auto; }
    </style>
</head>
<body class="login-page">

<div class="login-wrapper registro">

    <!-- ══ PANEL IZQUIERDO ══════════════════════════════════ -->
    <div class="login-left">
        <div class="deco-icon">🍫</div>
        <h1>¡Únete a<br>ChocoFlow!</h1>
        <p>Aquí podras Registrar<br>Nuevos Empleados</p>
        <a href="{% url 'dashboard' %}" class="btn-register">Volver al Dashboard</a>
    </div>

    <!-- ══ PANEL DERECHO ════════════════════════════════════ -->
    <div class="login-right">

        <h2 class="form-title">Crear Cuenta</h2>
        <p class="form-subtitle">Completa los datos para registrarte</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-choco">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'registro' %}">
            {% csrf_token %}

            <!-- ID / Documento -->
            <div class="input-group-custom">
                <input type="text" name="identificacion" class="form-control-login" placeholder="ID / Documento" required>
                <span class="input-icon">🪪</span>
            </div>

            <!-- Nombre -->
            <div class="input-group-custom">
                <input type="text" name="nombre" class="form-control-login" placeholder="Nombre completo" required>
                <span class="input-icon">👤</span>
            </div>

            <!-- Correo -->
            <div class="input-group-custom">
                <input type="email" name="correo" class="form-control-login" placeholder="Correo electrónico" required>
                <span class="input-icon">✉️</span>
            </div>

            <!-- Teléfono -->
            <div class="input-group-custom">
                <input type="tel" name="telefono" class="form-control-login" placeholder="Teléfono" required>
                <span class="input-icon">📞</span>
            </div>

            <!-- Dirección -->
            <div class="input-group-custom">
                <input type="text" name="direccion" class="form-control-login" placeholder="Dirección" required>
                <span class="input-icon">📍</span>
            </div>

            <!-- Contraseña -->
            <div class="input-group-custom">
                <input
                    type="password"
                    name="password"
                    id="password-registro"
                    class="form-control-login"
                    placeholder="Contraseña"
                    required
                >
                <span class="input-icon toggle-password" onclick="togglePassword('password-registro', this)" title="Mostrar/ocultar contraseña">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c49a6c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path class="eye-top" d="M2 12 C6 6, 18 6, 22 12"/>
                        <path class="eye-bot" d="M2 12 C6 18, 18 18, 22 12"/>
                        <circle class="eye-pupil" cx="12" cy="12" r="2.8" fill="#c49a6c" stroke="none"/>
                    </svg>
                </span>
            </div>

            <!-- Rol -->
<div class="input-group-custom">
    <select name="rol" id="rol-select" class="form-control-login" required onchange="toggleTurno()">
        <option value="">Seleccione rol</option>
        <option value="Administrador">Administrador</option>
        <option value="Supervisor">Supervisor</option>
    </select>
</div>

<!-- Turno (solo si es Supervisor) -->
<div class="input-group-custom" id="turno-field" style="display:none;">
    <select name="turno" id="turno-select" class="form-control-login">
        <option value="">Seleccione turno</option>
        <option value="Mañana 6:00am - 2:00pm">Mañana 6:00am - 2:00pm</option>
        <option value="Tarde 2:00pm - 10:00pm">Tarde 2:00pm - 10:00pm</option>
    </select>
</div>

<!-- Estado -->
<div class="input-group-custom">
    <select name="estado" class="form-control-login" required>
        <option value="Activo" selected>Activo</option>
        <option value="Inactivo">Inactivo</option>
        <option value="Suspendido">Suspendido</option>
        <option value="Incapacitado">Incapacitado</option>
    </select>
</div>

        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function toggleTurno() {
    const rol    = document.getElementById('rol-select').value;
    const campo  = document.getElementById('turno-field');
    const select = document.getElementById('turno-select');

    if (rol === 'Supervisor') {
        campo.style.display = 'block';
        select.required     = true;
    } else {
        campo.style.display = 'none';
        select.required     = false;
        select.value        = '';
    }
}
</script>
</body>
</html>
