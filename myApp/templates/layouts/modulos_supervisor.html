{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Supervisor | ChocoFlow
        {% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS DEL SUPERVISOR -->
    <link rel="stylesheet" href="{% static 'css/supervisor.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="sidebar-brand">
            <i class="bi bi-box-seam"></i> Supervisor
        </div>

        <nav class="mt-2">

            <a class="nav-link" href="{% url 'dashboard_supervisor' %}">
                <i class="bi bi-speedometer2"></i>
                Inicio
            </a>

            <a class="nav-link" href="{% url 'empleados_supervisor' %}">
                <i class="bi bi-people"></i>
                Empleados
            </a>

            <a class="nav-link" href="{% url 'turnos_supervisor' %}">
                <i class="bi bi-clock"></i>
                Turnos
            </a>

            <a class="nav-link" href="{% url 'asignaciones_supervisor' %}">
                <i class="bi bi-clipboard-check"></i>
                Asignaciones
            </a>

            <a class="nav-link" href="{% url 'exportaciones_supervisor' %}">
                <i class="bi bi-airplane"></i>
                Exportaciones
            </a>

            <a class="nav-link" href="{% url 'lotes_supervisor' %}">
                <i class="bi bi-box"></i>
                Lotes
            </a>

            <div class="sidebar-divider"></div>

            <a class="nav-link" href="#">
                <i class="bi bi-journal-text"></i>
                Bitácora Producción
            </a>

            <div class="sidebar-divider"></div>

            <a class="nav-link " href="{% url 'logout' %}">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </a>

        </nav>

    </div>

    <!-- CONTENIDO -->
    <main class="main-content">

        {% block content %}
        {% endblock %}

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_scripts %}
    {% endblock %}

</body>

</html>
